[project]
name = "applyai-backend"
version = "0.1.0"
description = "FastAPI backend for ApplyAI."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "beautifulsoup4>=4.12.3",
  "fastapi[standard]>=0.115.0",
  "httpx>=0.27.2",
  "openai>=1.50.0",
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "pypdf>=5.0.0",
  "sqlalchemy>=2.0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
